# Supabase's free plan pauses a project after about a week with no activity.
# This makes one tiny read a few times a week so woometer.com's backend stays
# awake even when nobody visits. It uses the public key from config.js, which
# isn't allowed to read any table, so the database answers "permission denied"
# (code 42501). That still counts as activity, and nobody's data is exposed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * 1,3,5" # Mon, Wed, Fri at 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from Supabase
        run: |
          url=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          key=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "No Supabase settings in config.js; nothing to keep awake."
            exit 0
          fi
          status=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-all-errors \
            "$url/rest/v1/profiles?select=id&limit=1" -H "apikey: $key")
          echo "Supabase answered HTTP $status: $(head -c 200 body.txt)"
          [ "$status" = 200 ] || grep -q '"42501"' body.txt
