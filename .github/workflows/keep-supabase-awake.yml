# Supabase's free plan pauses a project after about a week with no activity.
# This asks the database for the /stats numbers once a day, the same request
# woometer.com/stats makes, so the backend stays awake even when nobody visits.
#
# It must be a request the database actually answers. Until 2026-11-23 this
# read the profiles table, which the public key isn't allowed to read; the
# "permission denied" reply didn't count as activity and the project paused.
# site_stats() is open to the public key and returns only totals, never who
# answered what.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *" # every day at 09:17 UTC (GitHub may run it hours late)
  workflow_dispatch:

permissions:
  contents: read
  actions: write # only to keep this schedule switched on, below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ask Supabase for the site stats
        run: |
          url=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          key=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "No Supabase settings in config.js; nothing to keep awake."
            exit 0
          fi
          status=$(curl -sS -o body.txt -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors \
            -X POST "$url/rest/v1/rpc/site_stats" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}') || status="no answer"
          echo "Supabase answered HTTP $status: $(head -c 120 body.txt 2>/dev/null)"
          if [ "$status" != 200 ] || ! grep -q '"people"' body.txt; then
            echo "::error::Supabase didn't answer. If it was paused, restore it at https://supabase.com/dashboard/project/jtzwtqzsevsiuyobkvaw"
            exit 1
          fi

      # GitHub switches off scheduled workflows in a repository with no commits
      # for 60 days. Switching it on again each run resets that clock.
      - name: Keep this schedule switched on
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-supabase-awake.yml/enable"
