<!doctype html>
<!-- Source for icons/og-image.png, the picture shown when a woometer.com link
     is pasted into a chat or social post. Re-render it with:
     node tools/render-og-image.js -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 0%, #3b2463 0%, #1c1230 60%, #120c1e 100%);
      color: #f1ecf7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
    }
    .brand { flex: none; }
    .brand h1 { font-size: 140px; --alien: #4ade80; --alien-glow: rgb(74 222 128 / 60%); }
    .logo-meter { color: #f1ecf7; }
    .q { margin: 0 0 18px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; }
    .cats { display: flex; align-items: flex-end; gap: 26px; }
    .cats svg { display: block; width: 140px; height: auto; }
    .cats .big svg { width: 180px; }
  </style>
</head>
<body>
  <div class="brand">
    <h1 class="logo"><span class="logo-woo">w<svg class="eye eye-l" viewBox="0 0 20 20"><path d="M2.5 16.5C1.5 8.5 9 2.5 18 2.5 18.5 10.5 11 17.5 2.5 16.5z"/><ellipse class="glint" cx="13" cy="6.5" rx="2" ry="1.3" transform="rotate(-35 13 6.5)"/></svg><svg class="eye eye-r" viewBox="0 0 20 20"><path d="M2.5 16.5C1.5 8.5 9 2.5 18 2.5 18.5 10.5 11 17.5 2.5 16.5z"/><ellipse class="glint" cx="13" cy="6.5" rx="2" ry="1.3" transform="rotate(-35 13 6.5)"/></svg></span><span class="logo-meter">meter</span></h1>
  </div>
  <p class="q">How much woo do you believe?</p>
  <div class="cats" id="cats"></div>
  <script src="../cat.js"></script>
  <script>
    const row = document.getElementById("cats");
    [[0, ""], [9, ""], [20, "big"], [14, ""], [16, ""]].forEach(([stage, cls]) => {
      const el = document.createElement("div");
      el.className = cls;
      el.innerHTML = Cat.svg(stage);
      row.append(el);
    });
  </script>
</body>
</html>
