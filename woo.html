<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>woometer</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a1a45">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>
    // woometer.com/woo: a hidden playground. It shows the real home page, fetched
    // fresh so it always matches, over the psychedelic field from woo.js, with a
    // header slider to pretend any share of claims is answered and a starry
    // footer as tall as the header.
    (async () => {
      const HEAD = `
  <meta name="robots" content="noindex">
  <style>
    body { background: transparent; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    body > .layout { flex: 1; width: 100%; }
    .woo-field { position: fixed; inset: 0; z-index: -1; background: #0d0a14; pointer-events: none; }
    .woo-field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* The footer matches the header: same height, its own drifting stars. */
    body .foot { margin-top: 0; padding: 0 16px; position: relative; z-index: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid var(--line); background: var(--surface); }
    .foot p { margin: 0; position: relative; }
    .foot > .sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    /* The reveal slider: pretend you've answered this share of the claims. */
    .reveal { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; flex: 1 1 220px; max-width: 360px; }
    .reveal input { flex: 1; min-width: 0; accent-color: var(--accent); }
    .reveal output { min-width: 4.5ch; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
  </style>
`;
      const SLIDER = `
    <label class="reveal">
      <span class="reveal-label">Answered</span>
      <input type="range" id="reveal" min="0" max="100" step="0.5" value="0" aria-label="Pretend share of claims answered">
      <output id="reveal-out" for="reveal">0%</output>
    </label>
    <div class="top-actions">`;
      const TAIL = `
  <script src="woo.js?v=4"><\/script>
  <script>
    // Keep the footer exactly as tall as the header, however the header wraps.
    (() => {
      const header = document.querySelector("header.top");
      const footer = document.querySelector("footer.foot");
      new ResizeObserver(() => (footer.style.height = header.getBoundingClientRect().height + "px")).observe(header);
    })();
  <\/script>
</body>`;
      try {
        const reply = await fetch("./", { cache: "no-cache" });
        if (!reply.ok) throw new Error(reply.status);
        const html = (await reply.text())
          .replace("</head>", `${HEAD}</head>`)
          .replace("<body>", `<body>\n  <div class="woo-field" aria-hidden="true"><canvas id="field"></canvas></div>`)
          .replace(`<div class="top-actions">`, SLIDER)
          .replace(`<footer class="foot">`, `<footer class="foot" data-sky>`)
          .replace("</body>", TAIL);
        document.open();
        document.write(html);
        document.close();
      } catch {
        document.body.insertAdjacentHTML("beforeend", `<p style="text-align:center;padding:40px;color:var(--muted)">The playground couldn't load. <a href="./" style="color:inherit">Go to woometer</a></p>`);
      }
    })();
  </script>
</body>
</html>
