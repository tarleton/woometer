<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>woometer</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a1a45">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <script>
    // woometer.com/woo: a hidden playground. It shows the real home page, fetched
    // fresh so it always matches, with a header slider to pretend any share of
    // claims is answered and a button to send a shooting star right away.
    (async () => {
      const HEAD = `
  <meta name="robots" content="noindex">
  <style>
    /* The reveal slider: pretend you've answered this share of the claims. */
    .reveal { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; flex: 1 1 260px; max-width: 420px; }
    .reveal input { flex: 1; min-width: 0; accent-color: var(--accent); }
    .reveal output { min-width: 4.5ch; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
    /* Sends a shooting star over right now. */
    .shoot { flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; }
    .shoot:hover { border-color: var(--accent); }
    .shoot svg { width: 18px; height: 18px; }
  </style>
`;
      const SLIDER = `
    <label class="reveal">
      <span class="reveal-label">Answered</span>
      <input type="range" id="reveal" min="0" max="100" step="0.5" value="0" aria-label="Pretend share of claims answered">
      <output id="reveal-out" for="reveal">0%</output>
    </label>
    <button type="button" class="shoot" title="Send a shooting star" aria-label="Send a shooting star" onclick="window.dispatchEvent(new Event('woometer:shooting-star'))"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 5.6l1.9 4 4.3.5-3.2 2.9.9 4.3L12 15.1l-3.9 2.2.9-4.3-3.2-2.9 4.3-.5z" fill="currentColor"/></svg></button>
    <div class="top-actions">`;
      try {
        const reply = await fetch("./", { cache: "no-cache" });
        if (!reply.ok) throw new Error(reply.status);
        const html = (await reply.text())
          .replace("</head>", `${HEAD}</head>`)
          .replace(`<div class="top-actions">`, SLIDER);
        document.open();
        document.write(html);
        document.close();
      } catch {
        document.body.insertAdjacentHTML("beforeend", `<p style="text-align:center;padding:40px;color:var(--muted)">The playground couldn't load. <a href="./" style="color:inherit">Go to woometer</a></p>`);
      }
    })();
  </script>
</body>
</html>
